name: CI

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev clang

      - name: Configure loopback aliases
        run: |
          sudo ip addr add 127.0.1.1/32 dev lo
          sudo ip addr add 127.0.2.1/32 dev lo
          sudo ip addr add 127.0.3.1/32 dev lo
          sudo ip addr add 127.0.4.1/32 dev lo
          sudo ip addr add 127.0.1.2/32 dev lo
          sudo ip addr add 127.0.2.2/32 dev lo
          sudo ip addr add 127.0.3.2/32 dev lo
          sudo ip addr add 127.0.4.2/32 dev lo

      - name: Run tests
        run: make check

      - name: Sanitizers
        run: make check-sanitize

      - name: Stateful Flexicast fuzz smoke test
        run: make fuzz-flexicast-state LDFLAGS="-fsanitize=address,undefined -lpthread -lrt -ldl -lm -lcrypto -lssl"
